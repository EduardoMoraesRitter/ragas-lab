description: 'ragas-lab: avaliar respostas RAG já geradas (bom x ruim)'
prompts:
- '{{response}}'
providers:
- echo
defaultTest:
  options:
    provider:
      text:
        id: openai:chat:gemini-3.5-flash-lite
        config:
          apiBaseUrl: https://generativelanguage.googleapis.com/v1beta/openai
          apiKey: '{{env.OPENAI_API_KEY}}'
          temperature: 0
      embedding:
        id: openai:embedding:gemini-embedding-001
        config:
          apiBaseUrl: https://generativelanguage.googleapis.com/v1beta/openai
          apiKey: '{{env.OPENAI_API_KEY}}'
tests:
- description: bom-q1
  vars:
    modo: bom
    id: q1
    query: Qual é a pressão da bomba da Aurora K2 e quanto ela pesa?
    response: A cafeteira Aurora K2 possui uma bomba de 15 bar. O peso do aparelho
      é de 4,2 kg.
    context:
    - Aurora K2. A Aurora K2 foi lançada em outubro de 2021 como sucessora da K1.
      As principais mudanças foram a bomba de 15 bar, o reservatório maior e a caldeira
      de aço inox em lugar da de alumínio. Até dezembro de 2025 foram vendidas cerca
      de 210.000 unidades.
    - Qual a diferença para a Aurora K1?. A K2 tem bomba de 15 bar em vez de 9 bar,
      reservatório de 1,4 litro em vez de 1,0 litro e caldeira de aço inox. A K1 não
      é mais fabricada, mas ainda tem peças de reposição até 2027.
    - 'Especificações técnicas. A Aurora K2 é uma cafeteira de café moído com bomba
      de 15 bar. Potência de 1.350 W, tensão bivolt automática (127 V e 220 V). Reservatório
      de água removível de 1,4 litro. Peso de 4,2 kg. Dimensões: 32 cm de altura,
      18 cm de largura e 30 cm de profundidade.'
  assert:
  - type: context-faithfulness
    threshold: 0.5
  - type: answer-relevance
    threshold: 0.5
  - type: context-relevance
    threshold: 0.5
  - type: context-recall
    value: A bomba da Aurora K2 é de 15 bar e a máquina pesa 4,2 kg.
    threshold: 0.5
- description: bom-q2
  vars:
    modo: bom
    id: q2
    query: A cada quantas extrações devo descalcificar a Aurora K2 se a água da minha
      cidade for dura?
    response: Água dura acelera o acúmulo de calcário e recomendamos usar água filtrada
      e descalcificar a cada 150 extrações em vez de 300.
    context:
    - A água da minha cidade é dura. Isso é um problema?. Água dura acelera o acúmulo
      de calcário. Recomendamos usar água filtrada e descalcificar a cada 150 extrações
      em vez de 300. Danos por calcário não são cobertos pela garantia.
    - 'Descalcificação. Descalcifique a cada 300 extrações ou quando a luz indicadora
      piscar em vermelho. Use o descalcificante Aurora Clean ou ácido cítrico diluído
      a 2%. Nunca use vinagre: ele danifica a vedação de silicone da caldeira.'
    - Aurora K2. A Aurora K2 foi lançada em outubro de 2021 como sucessora da K1.
      As principais mudanças foram a bomba de 15 bar, o reservatório maior e a caldeira
      de aço inox em lugar da de alumínio. Até dezembro de 2025 foram vendidas cerca
      de 210.000 unidades.
  assert:
  - type: context-faithfulness
    threshold: 0.5
  - type: answer-relevance
    threshold: 0.5
  - type: context-relevance
    threshold: 0.5
  - type: context-recall
    value: Com água dura, a recomendação é descalcificar a cada 150 extrações, em
      vez das 300 do manual.
    threshold: 0.5
- description: bom-q3
  vars:
    modo: bom
    id: q3
    query: Quanto tempo de garantia eu tenho na Aurora K2?
    response: A Aurora K2 tem garantia legal e contratual de 12 meses contra defeitos
      de fabricação, contados a partir da data da nota fiscal.
    context:
    - Garantia. A Aurora K2 tem garantia legal e contratual de 12 meses contra defeitos
      de fabricação, contados a partir da data da nota fiscal. A garantia não cobre
      danos por queda, uso de descalcificante inadequado ou obstrução por água com
      alto teor de calcário.
    - Posso usar cápsulas na Aurora K2?. Não. A Aurora K2 funciona apenas com café
      moído. Não existe adaptador oficial para cápsulas e o uso de adaptadores de
      terceiros cancela a garantia.
    - A Aurora K2 tem aplicativo?. Não. A Aurora K2 não tem conectividade Wi-Fi ou
      Bluetooth e não existe aplicativo. O controle é feito apenas pelo botão giratório
      no painel.
  assert:
  - type: context-faithfulness
    threshold: 0.5
  - type: answer-relevance
    threshold: 0.5
  - type: context-relevance
    threshold: 0.5
  - type: context-recall
    value: A garantia padrão é de 12 meses. Quem cadastra a máquina no site em até
      30 dias ganha mais 12 meses, totalizando 24 meses.
    threshold: 0.5
- description: bom-q4
  vars:
    modo: bom
    id: q4
    query: Quem fundou a Caffeo Brasil e quem a preside hoje?
    response: A Caffeo Brasil foi fundada por Helena Brandt e Rogério Tancredi. Helena
      Brandt é a presidente desde a fundação.
    context:
    - A empresa. A Caffeo Brasil é uma fabricante de eletrodomésticos para café fundada
      em 2014 em Caxias do Sul, no Rio Grande do Sul. Começou importando moedores
      e passou a fabricar cafeteiras próprias em 2017.
    - Onde encontro assistência técnica?. A lista de assistências autorizadas está
      no site da Caffeo. Existem 46 pontos em todo o Brasil. Fora da garantia, a visita
      de diagnóstico custa R$ 90.
    - Fundadores e direção. A empresa foi fundada por Helena Brandt e Rogério Tancredi.
      Helena Brandt é a presidente desde a fundação. Rogério Tancredi deixou a sociedade
      em 2020 e hoje dirige uma torrefação em Curitiba.
  assert:
  - type: context-faithfulness
    threshold: 0.5
  - type: answer-relevance
    threshold: 0.5
  - type: context-relevance
    threshold: 0.5
  - type: context-recall
    value: A Caffeo Brasil foi fundada por Helena Brandt e Rogério Tancredi. Helena
      Brandt é a presidente desde a fundação.
    threshold: 0.5
- description: bom-q5
  vars:
    modo: bom
    id: q5
    query: Por que a Aurora K1 passou por recall e quantas unidades foram afetadas?
    response: Em agosto de 2019, a Caffeo fez um recall voluntário da Aurora K1 devido
      a uma falha no anel de vedação da caldeira, que podia vazar vapor. O total de
      unidades afetadas foi de 18.000. Nenhum ferimento foi registrado em decorrência
      do problema.
    context:
    - Recall da K1. Em agosto de 2019 a Caffeo fez um recall voluntário de 18.000
      unidades da Aurora K1 por falha no anel de vedação da caldeira, que podia vazar
      vapor. Nenhum ferimento foi registrado. O custo do recall foi de aproximadamente
      R$ 2,1 milhões.
    - Aurora K1. A Aurora K1 foi a primeira cafeteira própria da Caffeo, lançada em
      março de 2017. Tinha bomba de 9 bar e reservatório de 1,0 litro. Foi descontinuada
      em 2021.
    - Qual a diferença para a Aurora K1?. A K2 tem bomba de 15 bar em vez de 9 bar,
      reservatório de 1,4 litro em vez de 1,0 litro e caldeira de aço inox. A K1 não
      é mais fabricada, mas ainda tem peças de reposição até 2027.
  assert:
  - type: context-faithfulness
    threshold: 0.5
  - type: answer-relevance
    threshold: 0.5
  - type: context-relevance
    threshold: 0.5
  - type: context-recall
    value: O recall de agosto de 2019 foi por falha no anel de vedação da caldeira,
      que podia vazar vapor. Foram 18.000 unidades.
    threshold: 0.5
- description: bom-q6
  vars:
    modo: bom
    id: q6
    query: Posso usar vinagre para descalcificar e a máquina aceita cápsulas?
    response: Não, você nunca deve usar vinagre para descalcificar, pois ele danifica
      a vedação de silicone da caldeira. Além disso, a Aurora K2 funciona apenas com
      café moído e não aceita cápsulas.
    context:
    - 'Descalcificação. Descalcifique a cada 300 extrações ou quando a luz indicadora
      piscar em vermelho. Use o descalcificante Aurora Clean ou ácido cítrico diluído
      a 2%. Nunca use vinagre: ele danifica a vedação de silicone da caldeira.'
    - A luz está piscando em vermelho. O que faço?. Luz vermelha piscando significa
      que a máquina pede descalcificação. Siga o procedimento do manual. A luz volta
      ao normal depois de um ciclo completo de descalcificação.
    - Posso usar cápsulas na Aurora K2?. Não. A Aurora K2 funciona apenas com café
      moído. Não existe adaptador oficial para cápsulas e o uso de adaptadores de
      terceiros cancela a garantia.
  assert:
  - type: context-faithfulness
    threshold: 0.5
  - type: answer-relevance
    threshold: 0.5
  - type: context-relevance
    threshold: 0.5
  - type: context-recall
    value: Não aos dois. Vinagre danifica a vedação de silicone da caldeira. A máquina
      só funciona com café moído e não existe adaptador oficial para cápsulas.
    threshold: 0.5
- description: bom-q7
  vars:
    modo: bom
    id: q7
    query: O que significa o código de erro E2 e como resolver?
    response: O código de erro E2 significa pressão insuficiente causada por moagem
      grossa demais, que deixa o café aguado. Para resolver, verifique a moagem e
      utilize uma moagem fina, parecida com açúcar refinado, evitando que seja grossa
      demais.
    context:
    - 'Códigos de erro. E1: reservatório vazio ou mal encaixado. E2: pressão insuficiente,
      verifique a moagem. E3: superaquecimento, aguarde 15 minutos. E4: falha na bomba,
      procure a assistência.'
    - Qual moagem devo usar?. Moagem fina, parecida com açúcar refinado. Moagem grossa
      demais causa café aguado e o código de erro E2. Moagem fina demais pode entupir
      o filtro.
    - A luz está piscando em vermelho. O que faço?. Luz vermelha piscando significa
      que a máquina pede descalcificação. Siga o procedimento do manual. A luz volta
      ao normal depois de um ciclo completo de descalcificação.
  assert:
  - type: context-faithfulness
    threshold: 0.5
  - type: answer-relevance
    threshold: 0.5
  - type: context-relevance
    threshold: 0.5
  - type: context-recall
    value: E2 é pressão insuficiente. A causa comum é moagem grossa demais. A solução
      é usar moagem fina, parecida com açúcar refinado.
    threshold: 0.5
